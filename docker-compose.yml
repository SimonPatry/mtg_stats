# MariaDB de développement pour le projet fusionné.
#
#   docker compose up -d      démarrer
#   docker compose down       arrêter (les données sont conservées)
#   docker compose down -v    arrêter ET effacer les données
#
# Le port hôte est configurable si 3306 est déjà pris chez vous :
#   DB_PORT=3307 docker compose up -d
#
services:
  db:
    image: mariadb:11.4
    container_name: mtg-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-mtg}
      MARIADB_USER: ${DB_USER:-mtg}
      MARIADB_PASSWORD: ${DB_PASSWORD:-mtg}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mtg-db-data:/var/lib/mysql
      # Joué une seule fois, à la création du volume : crée la base de test
      # à côté de la base de développement.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mtg-db-data:
